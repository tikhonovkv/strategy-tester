# Timeweb Cloud App Platform — Docker Compose.
services:
  web:
    build: .
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

  futures-bot:
    build: ./python_research/futures
    restart: unless-stopped
    environment:
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET}
      - LIVE_MODE=${LIVE_MODE:-0}
      - BOOTSTRAP=${BOOTSTRAP:-1}
